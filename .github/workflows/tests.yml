name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: [highest, lowest]

    name: PHP ${{ matrix.php }} — ${{ matrix.dependencies }} deps

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The readers are all guarded and fall back, so a missing /proc is not
      # a failure — but CI runs on Linux, which means the cgroup and
      # /proc/meminfo paths are exercised for real here as well as through
      # the fixtures.
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: vendor/bin/phpunit
